name: Validate YunoHost package

on:
  push:
  pull_request:

jobs:
  python-and-shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Compile Python
        run: python -m compileall src tests
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Check shell syntax
        run: bash -n scripts/_common.sh scripts/install scripts/upgrade scripts/remove scripts/backup scripts/restore scripts/change_url
      - name: Check TOML
        run: python - <<'PY'
import pathlib, tomllib
for path in [pathlib.Path('manifest.toml'), pathlib.Path('tests.toml'), pathlib.Path('conf/feeds.toml')]:
    tomllib.loads(path.read_text())
print('TOML OK')
PY
