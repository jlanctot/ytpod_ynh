#:schema https://raw.githubusercontent.com/YunoHost/apps/main/schemas/manifest.v2.schema.json

packaging_format = 2

id = "ytpod"
name = "YTPod"
description.en = "Turn YouTube channels and playlists into private podcast feeds"
description.fr = "Transformez des chaînes et listes de lecture YouTube en flux de podcasts privés"
version = "0.1~ynh1"

maintainers = ["YTPod contributors"]

[upstream]
license = "MIT"
website = "https://github.com/jlanctot/ytpod_ynh"
admindoc = "https://github.com/jlanctot/ytpod_ynh#readme"
userdoc = "https://github.com/jlanctot/ytpod_ynh#readme"
code = "https://github.com/jlanctot/ytpod_ynh"

[integration]
yunohost = ">= 12.1.38"
helpers_version = "2.1"
architectures = "all"
multi_instance = true
ldap = false
sso = true
disk = "150M"
ram.build = "100M"
ram.runtime = "256M"

[install]

[install.domain]
type = "domain"

[install.path]
type = "path"
default = "/ytpod"

[install.init_main_permission]
type = "group"
default = "visitors"

[resources]

[resources.system_user]

[resources.install_dir]

[resources.data_dir]
subdirs = ["media", "state", "artwork"]

[resources.permissions]
main.url = "/"
main.show_tile = false
main.auth_header = false
admin.url = "/admin"
admin.show_tile = true
admin.allowed = "admins"
admin.auth_header = true

[resources.ports]
main.default = 8746

[resources.apt]
packages = ["ca-certificates", "ffmpeg", "python3", "python3-pip", "python3-venv"]
